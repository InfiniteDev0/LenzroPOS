# PowerSync Sync Streams — the complete, authoritative config.
#
# This file is the source of truth. It is NOT read at runtime: paste the
# whole file into the PowerSync dashboard (Manage instance > Sync Streams)
# and deploy. Always paste the WHOLE file, never a fragment — splicing one
# stream into the deployed config is how it drifted out of sync with
# apps/pos/src/lib/powersync/AppSchema.js in the first place.
#
# Every table here must also exist in AppSchema.js, and vice versa.
#
# Four rules this config works around:
#
#   0. `auto_subscribe: true` on EVERY stream. Sync Streams sync nothing
#      by default — the client is expected to subscribe to the streams it
#      wants, and `auto_subscribe` defaults to false. A valid, deployed
#      config with none of these therefore syncs an empty database to
#      every device and reports no error anywhere, which is exactly as
#      confusing as it sounds. This till is offline-first for a single
#      account, so it wants all of its own data, always.
#
#   1. A stream SELECTs from exactly ONE table. Joining to reach a parent
#      is rejected with "Must SELECT from a single table". Tables with no
#      account_id of their own are scoped with a subquery in the WHERE
#      instead, which is the supported way to express "belongs to one of
#      my rows" — and it nests, so a grandchild filters through its
#      parent's own subquery.
#   2. PowerSync requires every synced row to have an `id` column. Two
#      tables don't have one in Postgres — stock_levels (PK is item_id)
#      and account_settings (PK is account_id) — so both alias their PK
#      to `id`, which then means listing every column explicitly rather
#      than using `*`.
#   3. `config.edition` at the bottom is required. Without it PowerSync
#      falls back to the alpha syntax and rejects every stream here.
#
# Every subquery below partitions data by ownership (account_id), which
# is both the point and, incidentally, what keeps this clear of
# CVE-2026-30870 — that affected subqueries used only to decide whether a
# table syncs at all, and was fixed in service-core 1.20.1.

streams:
  # --- Menu -----------------------------------------------------------
  menu_categories:
    auto_subscribe: true
    query: SELECT * FROM categories WHERE account_id = auth.user_id()

  menu_items:
    auto_subscribe: true
    query: SELECT * FROM items WHERE account_id = auth.user_id()

  menu_item_variants:
    auto_subscribe: true
    query: |
      SELECT * FROM item_variants
      WHERE item_id IN (
        SELECT id FROM items WHERE account_id = auth.user_id()
      )

  # Two levels down from items, so the subquery nests.
  menu_item_variant_values:
    auto_subscribe: true
    query: |
      SELECT * FROM item_variant_values
      WHERE variant_id IN (
        SELECT id FROM item_variants WHERE item_id IN (
          SELECT id FROM items WHERE account_id = auth.user_id()
        )
      )

  # PK is item_id, aliased to id — which forces every other column to be
  # listed explicitly (see rule 2 above).
  stock_levels:
    auto_subscribe: true
    query: |
      SELECT
        item_id as id,
        item_id,
        quantity,
        low_stock_threshold
      FROM stock_levels
      WHERE item_id IN (
        SELECT id FROM items WHERE account_id = auth.user_id()
      )

  # --- Sales ----------------------------------------------------------
  orders:
    auto_subscribe: true
    query: SELECT * FROM orders WHERE account_id = auth.user_id()

  order_items:
    auto_subscribe: true
    query: |
      SELECT * FROM order_items
      WHERE order_id IN (
        SELECT id FROM orders WHERE account_id = auth.user_id()
      )

  discount_types:
    auto_subscribe: true
    query: SELECT * FROM discount_types WHERE account_id = auth.user_id()

  # --- Staff, devices, shifts, trading days ---------------------------
  employees:
    auto_subscribe: true
    query: SELECT * FROM employees WHERE account_id = auth.user_id()

  pos_devices:
    auto_subscribe: true
    query: SELECT * FROM pos_devices WHERE account_id = auth.user_id()

  shifts:
    auto_subscribe: true
    query: SELECT * FROM shifts WHERE account_id = auth.user_id()

  shift_expenses:
    auto_subscribe: true
    query: |
      SELECT * FROM shift_expenses
      WHERE shift_id IN (
        SELECT id FROM shifts WHERE account_id = auth.user_id()
      )

  business_days:
    auto_subscribe: true
    query: SELECT * FROM business_days WHERE account_id = auth.user_id()

  # --- Open tabs (customer credit) ------------------------------------
  customers:
    auto_subscribe: true
    query: SELECT * FROM customers WHERE account_id = auth.user_id()

  customer_payments:
    auto_subscribe: true
    query: SELECT * FROM customer_payments WHERE account_id = auth.user_id()

  customer_payment_allocations:
    auto_subscribe: true
    query: |
      SELECT * FROM customer_payment_allocations
      WHERE payment_id IN (
        SELECT id FROM customer_payments WHERE account_id = auth.user_id()
      )

  # --- Settings the till has to honour --------------------------------
  # PK is account_id, aliased to id — same explicit-column rule as
  # stock_levels above.
  account_settings:
    auto_subscribe: true
    query: |
      SELECT
        account_id as id,
        shifts_enabled,
        open_tickets_enabled,
        low_stock_alerts_enabled,
        negative_stock_alerts_enabled,
        receipt_header,
        receipt_footer,
        receipt_show_customer,
        receipt_logo_url
      FROM account_settings
      WHERE account_id = auth.user_id()

  payment_types:
    auto_subscribe: true
    query: SELECT * FROM payment_types WHERE account_id = auth.user_id()

# Required, and must be 3: edition 2 is the alpha syntax and the
# dashboard warns about it. Edition 3 is what supports the subquery
# filtering every child stream above depends on.
config:
  edition: 3
